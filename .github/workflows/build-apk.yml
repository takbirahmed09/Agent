
name: Build Kivy APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "cmdline-tools;latest"

          yes | sdkmanager --licenses

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Configure Buildozer SDK
        shell: bash
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK_ROOT"
          cp -a "$ANDROID_HOME/." "$SDK_ROOT/"

          mkdir -p "$SDK_ROOT/tools/bin"

          cat > "$SDK_ROOT/tools/bin/sdkmanager" <<EOF
          #!/bin/bash
          exec "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "\$@"
          EOF

          chmod +x "$SDK_ROOT/tools/bin/sdkmanager"

          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          "$SDK_ROOT/tools/bin/sdkmanager" --version

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-APK
          path: bin/*.apk
          if-no-files-found: error
          
